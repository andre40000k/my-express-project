<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Auth Portal</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-card">
            <h2 class="form-title">Welcome Back</h2>
            <form action="/auth/login" method="post">
                <div class="form-group">
                    <label>Email</label>
                    <input name="email" type="email" required value="test@com.n">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input name="password" type="password" required value="qwert">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="divider"><span>or</span></div>

            <form action="/auth/google" method="GET">
                <button type="submit" class="btn-google">Continue with Google</button>
            </form>

            <a href="http://localhost:3000/users" class="link">Access Protected Resource</a>
        </div>

        <div class="auth-card">
            <h2 class="form-title">Create Account</h2>
            <form class="user-form" action="/auth/register" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required minlength="2" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required
                        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                        placeholder="At least 8 characters">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>

        <form action="/auth/logout" method="GET">
            <button type="submit" class="btn-logout">Log Out</button>
        </form>
    </div>
</body>

</html>
